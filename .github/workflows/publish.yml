name: Publish to npm

# Publishes the package to npm using GitHub's OIDC trusted publishing.
# No npm tokens and no 2FA prompts are required — npm verifies the workflow
# identity via OIDC. Configure the trusted publisher once at:
#   npmjs.com -> package "n8n-nodes-grain" -> Settings -> Trusted Publisher -> GitHub Actions
# (org/user = your GitHub account, repo = n8n-nodes-grain, workflow = publish.yml)

on:
  # Publish when you push a version tag, e.g. `git tag v0.1.1 && git push --tags`
  push:
    tags:
      - 'v*'
  # ...or trigger manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest # trusted publishing needs npm >= 11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Publish (build + lint run via prepublishOnly)
        run: npm publish --provenance --access public
